<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Transformation Plan - FitnessAI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/chat-widget.css">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #FF8E72;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .nav {
            background: linear-gradient(135deg, #FF6B6B, #FF8E72);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .plan-display {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .plan-display.active {
            display: block;
        }

        .plan-title {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .plan-section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .plan-section:last-child {
            border-bottom: none;
        }

        .section-title {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-content {
            color: #555;
            line-height: 1.8;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        .milestone {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .exercise-list {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="logo">💪 FitnessAI</div>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>🎯 Body Transformation Plan</h1>
            <p>Create your personalized multi-week transformation journey</p>
        </div>

        <div class="form-card" id="formCard">
            <form onsubmit="generatePlan(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>📊 Current Weight (kg)</label>
                        <input type="number" id="currentWeight" step="0.1" required placeholder="e.g., 75">
                    </div>
                    <div class="form-group">
                        <label>🎯 Target Weight (kg)</label>
                        <input type="number" id="targetWeight" step="0.1" required placeholder="e.g., 65">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>⏱️ Duration (Weeks)</label>
                        <select id="weeks" required>
                            <option value="4">4 weeks</option>
                            <option value="8">8 weeks</option>
                            <option value="12" selected>12 weeks</option>
                            <option value="16">16 weeks</option>
                            <option value="24">24 weeks</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏋️ Fitness Level</label>
                        <select id="fitnessLevel" required>
                            <option value="beginner">Beginner</option>
                            <option value="intermediate" selected>Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>🎪 Goal</label>
                    <select id="goal" required>
                        <option value="weight loss">Weight Loss</option>
                        <option value="muscle gain">Muscle Gain</option>
                        <option value="body recomposition">Body Recomposition</option>
                        <option value="endurance">Endurance</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">🚀 Generate Transformation Plan</button>
            </form>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Creating your personalized transformation plan...</p>
        </div>

        <div class="plan-display" id="planDisplay">
            <div class="plan-title">✨ Your Transformation Plan</div>
            <div id="planContent"></div>
        </div>
    </div>

    <script>
        async function generatePlan(event) {
            event.preventDefault();

            const currentWeight = document.getElementById('currentWeight').value;
            const targetWeight = document.getElementById('targetWeight').value;
            const weeks = document.getElementById('weeks').value;
            const goal = document.getElementById('goal').value;
            const fitnessLevel = document.getElementById('fitnessLevel').value;

            document.getElementById('formCard').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/generate-transformation-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_weight: currentWeight,
                        target_weight: targetWeight,
                        weeks: weeks,
                        goal: goal,
                        fitness_level: fitnessLevel
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayPlan(data.plan);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('planDisplay').classList.add('active');
                } else {
                    throw new Error(data.error || 'Failed to generate plan');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('formCard').style.display = 'block';
                alert('Error: ' + error.message);
            }
        }

        function displayPlan(plan) {
            const planContent = document.getElementById('planContent');
            planContent.innerHTML = '';

            // Weekly Breakdown
            if (plan.weekly_breakdown) {
                const weekSection = document.createElement('div');
                weekSection.className = 'plan-section';
                weekSection.innerHTML = '<div class="section-title">📅 Weekly Breakdown</div>';
                const milestoneDiv = document.createElement('div');
                plan.weekly_breakdown.forEach((week, index) => {
                    const milestone = document.createElement('div');
                    milestone.className = 'milestone';
                    milestone.innerHTML = `<strong>Week ${index + 1}:</strong> ${week}`;
                    milestoneDiv.appendChild(milestone);
                });
                weekSection.appendChild(milestoneDiv);
                planContent.appendChild(weekSection);
            }

            // Nutrition Plan
            if (plan.nutrition_plan) {
                const nutritionSection = document.createElement('div');
                nutritionSection.className = 'plan-section';
                nutritionSection.innerHTML = `
                    <div class="section-title">🥗 Nutrition Plan</div>
                    <div class="section-content">${plan.nutrition_plan}</div>
                `;
                planContent.appendChild(nutritionSection);
            }

            // Workout Plan
            if (plan.workout_plan) {
                const workoutSection = document.createElement('div');
                workoutSection.className = 'plan-section';
                workoutSection.innerHTML = `
                    <div class="section-title">💪 Workout Plan</div>
                    <div class="section-content">${plan.workout_plan}</div>
                `;
                planContent.appendChild(workoutSection);
            }

            // Timeline
            if (plan.timeline) {
                const timelineSection = document.createElement('div');
                timelineSection.className = 'plan-section';
                timelineSection.innerHTML = `
                    <div class="section-title">⏳ Timeline & Milestones</div>
                    <div class="section-content">${plan.timeline}</div>
                `;
                planContent.appendChild(timelineSection);
            }

            // Supplements
            if (plan.supplements) {
                const supplementSection = document.createElement('div');
                supplementSection.className = 'plan-section';
                supplementSection.innerHTML = `
                    <div class="section-title">💊 Supplements</div>
                    <div class="section-content">${plan.supplements}</div>
                `;
                planContent.appendChild(supplementSection);
            }

            // Tips
            if (plan.tips) {
                const tipsSection = document.createElement('div');
                tipsSection.className = 'plan-section';
                tipsSection.innerHTML = `
                    <div class="section-title">🎯 Success Tips</div>
                    <div class="section-content">${plan.tips}</div>
                `;
                planContent.appendChild(tipsSection);
            }
        }
    </script>
    <script src="/static/chat-widget.js"></script>
</body>

</html>
